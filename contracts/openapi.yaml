openapi: 3.1.0
info:
  title: AVM FRITZ!Box REST API (extracted from FRITZ!OS firmware)
  version: 4.2.0
  description: 'Statically extracted from the Lua REST API handlers (/usr/rest_api)
    of the official AVM FRITZ!Box 7590 AX firmware 08.25 (FRITZ!OS 7.63, rest_api
    version 4.2.0). Unpacked via firmware image extraction; see also
    www/js3/rest-helper.js and www/avm/js/http.js for the client side.


    Auth: HTTP header ''Authorization: AVM-SID {sid}'' -- session id from
    login_sid.lua/JASONII login flow.


    Base paths: /api/v0, /api/v0/generic, /api/v0/dino, plugin paths /api/v0/<plugin>.

    Overview at GET /api/v0 lists available plugin URLs.


    Dynamic payloads emitted as additionalProperties: true.'
servers:
- url: http://{fritzbox}
  variables:
    fritzbox:
      default: fritz.box
      description: FRITZ!Box hostname.
security:
- AVM_SID: []
components:
  securitySchemes:
    AVM_SID:
      type: apiKey
      in: header
      name: Authorization
      description: 'Format: AVM-SID {sid} — session id from JASONII login_sid.lua
        / ajax.js.'
  schemas:
    ErrorEnvelope:
      type: object
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            type: object
            required:
            - code
            - message
            properties:
              code:
                type: integer
                description: rest_api_const status code
              message:
                type: string
              field:
                type: string
              extension:
                type: object
                additionalProperties: true
    WlanUIMod:
      type: object
      properties:
        APEnvStatus:
          type: string
          description: 0=done, 1=busy, 3=busy, 2=error
        APEnv:
          type: array
          items:
            type: object
            properties:
              params:
                type: string
                description: 'Lua-table string: { ssid = "...", rssi = -66, ... }'
      additionalProperties: true
      description: /api/v0/generic/wlan UIMod payload (subset); other keys are UIMod-defined
        and dynamic
    WlanScanTrigger:
      type: object
      required:
      - scan_apenv
      properties:
        scan_apenv:
          type: string
          enum:
          - '1'
          description: set to "1" to start neighbor scan
    PhoneCalls:
      properties:
        enabled:
          type: boolean
          description: call log active
        calls:
          type: array
          items:
            $ref: '#/components/schemas/CallEntry'
      required:
      - enabled
      - calls
    CallEntry:
      type: object
      description: libcallloglua.GetAll entry (abridged; additional fields may exist)
      additionalProperties: true
    SuccessObj:
      type: object
      properties:
        success:
          type: integer
    Notifications:
      type: array
      items:
        type: object
        additionalProperties: true
      description: libboxnotifylua.GetBoxNotifications
    FaxJournal:
      type: array
      items:
        type: object
        additionalProperties: true
    WebUsbBrowse:
      type: object
      properties:
        accessoryUrl:
          type: string
        indexingState:
          type: string
          enum:
          - busy
          - ready
        pathInfo:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              path:
                type: string
              storageType:
                type: string
    WebUsbPut:
      type: object
      properties:
        startIndexing:
          type: string
          enum:
          - busy
          - error
          - ok
    SmDeviceStatistics:
      type: object
      additionalProperties: true
      description: Temperatures24h / Humidity24h / VoltageHour / PowerHour / Energy24h/Week/Month/2Years
    SmIndex:
      type: object
      properties:
        devices:
          type: array
          items:
            type: object
            additionalProperties: true
        templates:
          type: array
          items:
            type: object
            additionalProperties: true
        triggers:
          type: array
          items:
            type: object
            additionalProperties: true
        global:
          type: object
          additionalProperties: true
          description: only on non-simplified
    SmDeviceList:
      type: array
      items:
        $ref: '#/components/schemas/SmDevice'
    SmDevice:
      type: object
      description: libaha.GetEnhDevice (dynamic shape)
      additionalProperties: true
    SmTemplateList:
      type: array
      items:
        type: object
        additionalProperties: true
    SmTriggerList:
      type: array
      items:
        type: object
        additionalProperties: true
    SmTrigger:
      type: object
      additionalProperties: true
    SmGlobal:
      type: object
      additionalProperties: true
    StorageRights:
      type: array
      items:
        type: object
        properties:
          _node:
            type: string
          path:
            type: string
          status:
            type: string
          access:
            type: array
            items:
              type: object
              properties:
                _node:
                  type: string
                username:
                  type: string
                boxusers_UID:
                  type: string
                access_from_local:
                  type: string
                access_from_internet:
                  type: string
                write_access_from_local:
                  type: string
                write_access_from_internet:
                  type: string
    StorageRightsPost:
      type: object
      required:
      - boxusers_UID
      - access
      properties:
        boxusers_UID:
          type: string
          description: boxuser id
        access:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              access_from_local:
                type: string
              access_from_internet:
                type: string
              write_access_from_local:
                type: string
              write_access_from_internet:
                type: string
    InfoVersion:
      type: object
      properties:
        version:
          type: string
          example: 4.2.0
    SmTamCalls:
      type: array
      items:
        type: object
        additionalProperties: true
    GenericUIMod:
      type: object
      additionalProperties: true
      description: arbitrary UIMod JSON from TR-064-like scheme
