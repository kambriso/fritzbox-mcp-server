variables:
  RUNNER_GENERATE_ARTIFACTS_METADATA: "true"

test:
  image: golang:1.25
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always
  script:
    - make tidy
    - make test

build:
  image: golang:1.25
  rules:
    - if: $CI_COMMIT_TAG
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - VERSION=${CI_COMMIT_TAG#v}
    - echo "VERSION=$VERSION" >> build.env
    - echo "BUILD_JOB_ID=$CI_JOB_ID" >> build.env
    - make dists
    # Flatten binaries for release
    - mkdir -p release
    - cp build/linux/amd64/fritz-mcp release/fritz-mcp-linux-amd64
    - cp build/linux/arm64/fritz-mcp release/fritz-mcp-linux-arm64
    - cp build/linux/arm/fritz-mcp release/fritz-mcp-linux-arm
    - cp build/linux/386/fritz-mcp release/fritz-mcp-linux-386
    - cp build/darwin/amd64/fritz-mcp release/fritz-mcp-darwin-amd64
    - cp build/darwin/arm64/fritz-mcp release/fritz-mcp-darwin-arm64
    - cp build/windows/amd64/fritz-mcp.exe release/fritz-mcp-windows-amd64.exe
    - cp build/windows/arm64/fritz-mcp.exe release/fritz-mcp-windows-arm64.exe
    - cp build/wasi/wasm/fritz-mcp.wasm release/fritz-mcp-wasi.wasm
    - (cd release && sha256sum fritz-mcp-* > SHA256SUMS)
    # Install cosign for signing
    - apt-get update && apt-get install -y curl
    - curl -sSL https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64 -o /usr/local/bin/cosign
    - chmod +x /usr/local/bin/cosign
    # Sign each binary with keyless signing (OIDC)
    - |
      for f in release/fritz-mcp-*; do
        cosign sign-blob --yes \
          --oidc-issuer=https://gitlab.com \
          --output-signature="${f}.sig" \
          --output-certificate="${f}.pem" \
          "$f"
      done
  artifacts:
    expire_in: never
    paths:
      - release/
    reports:
      dotenv: build.env

release:
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: build
      artifacts: true
  script:
    - echo "Creating release $VERSION"
  release:
    tag_name: $CI_COMMIT_TAG
    name: $VERSION
    description: Release $VERSION
    assets:
      links:
        - name: fritz-mcp-linux-amd64
          url: "${CI_PROJECT_URL}/-/jobs/${BUILD_JOB_ID}/artifacts/raw/release/fritz-mcp-linux-amd64"
          filepath: /fritz-mcp-linux-amd64
        - name: fritz-mcp-linux-amd64.sig
          url: "${CI_PROJECT_URL}/-/jobs/${BUILD_JOB_ID}/artifacts/raw/release/fritz-mcp-linux-amd64.sig"
          filepath: /fritz-mcp-linux-amd64.sig
        - name: fritz-mcp-linux-amd64.pem
          url: "${CI_PROJECT_URL}/-/jobs/${BUILD_JOB_ID}/artifacts/raw/release/fritz-mcp-linux-amd64.pem"
          filepath: /fritz-mcp-linux-amd64.pem
        - name: fritz-mcp-linux-arm64
