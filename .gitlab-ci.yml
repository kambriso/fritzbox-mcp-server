variables:
  RUNNER_GENERATE_ARTIFACTS_METADATA: "true"

test:
  image: golang:1.25
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always
  script:
    - make tidy
    - make test

build:
  image: golang:1.25
  rules:
    - if: $CI_COMMIT_TAG
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - VERSION=${CI_COMMIT_TAG#v}
    - echo "VERSION=$VERSION" >> build.env
    - make dists
    - (cd build && find . -type f -name 'fritz-mcp*' -exec sha256sum {} \; > ../SHA256SUMS)
    # Install cosign for signing
    - apt-get update && apt-get install -y curl
    - curl -sSL https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64 -o /usr/local/bin/cosign
    - chmod +x /usr/local/bin/cosign
    # Sign each binary with keyless signing (OIDC)
    - |
      for f in $(find build -type f -name 'fritz-mcp*'); do
        cosign sign-blob --yes \
          --oidc-issuer=https://gitlab.com \
          --output-signature="${f}.sig" \
          --output-certificate="${f}.pem" \
          "$f"
      done
  artifacts:
    paths:
      - build/
      - SHA256SUMS
    reports:
      dotenv: build.env

release:
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: build
      artifacts: true
  script:
    - echo "Creating release $VERSION"
  release:
    tag_name: $CI_COMMIT_TAG
    name: $VERSION
    description: Release $VERSION
    assets:
      links:
        - name: SHA256SUMS
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/file/SHA256SUMS"
