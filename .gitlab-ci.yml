        - name: fritz-mcp-wasi.wasm.sig
          url: "${PACKAGE_REGISTRY_URL}/fritz-mcp-wasi.wasm.sig"
          filepath: /fritz-mcp-wasi.wasm.sig
        - name: fritz-mcp-wasi.wasm.pem
          url: "${PACKAGE_REGISTRY_URL}/fritz-mcp-wasi.wasm.pem"
          filepath: /fritz-mcp-wasi.wasm.pem
        - name: SHA256SUMS
          url: "${PACKAGE_REGISTRY_URL}/SHA256SUMS"
          filepath: /SHA256SUMS
        - name: artifacts-metadata.json
          url: "${PACKAGE_REGISTRY_URL}/artifacts-metadata.json"
          filepath: /artifacts-metadata.json
