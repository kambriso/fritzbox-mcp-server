variables:
  RUNNER_GENERATE_ARTIFACTS_METADATA: "true"
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/fritzbox-mcp-server/${CI_COMMIT_TAG}"

test:
  image: golang:1.25
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always
  script:
    - make tidy
    - make test

build:
  image: golang:1.25
  rules:
    - if: $CI_COMMIT_TAG
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - VERSION=${CI_COMMIT_TAG#v}
    - make dists
    # Flatten binaries for release
    - mkdir -p release
    - cp build/linux/amd64/fritz-mcp release/fritz-mcp-linux-amd64
    - cp build/linux/arm64/fritz-mcp release/fritz-mcp-linux-arm64
    - cp build/linux/arm/fritz-mcp release/fritz-mcp-linux-arm
    - cp build/linux/386/fritz-mcp release/fritz-mcp-linux-386
    - cp build/darwin/amd64/fritz-mcp release/fritz-mcp-darwin-amd64
    - cp build/darwin/arm64/fritz-mcp release/fritz-mcp-darwin-arm64
    - cp build/windows/amd64/fritz-mcp.exe release/fritz-mcp-windows-amd64.exe
    - cp build/windows/arm64/fritz-mcp.exe release/fritz-mcp-windows-arm64.exe
    - cp build/wasi/wasm/fritz-mcp.wasm release/fritz-mcp-wasi.wasm
    - (cd release && sha256sum fritz-mcp-* > SHA256SUMS)
    # Install cosign for signing
    - apt-get update && apt-get install -y curl
    - curl -sSL https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64 -o /usr/local/bin/cosign
    - chmod +x /usr/local/bin/cosign
    # Sign each binary with keyless signing (OIDC)
    - |
      for f in release/fritz-mcp-*; do
        cosign sign-blob --yes \
          --oidc-issuer=https://gitlab.com \
          --output-signature="${f}.sig" \
          --output-certificate="${f}.pem" \
          "$f"
      done
    # Upload all files to Generic Package Registry
    - |
      for f in release/*; do
        curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$f" \
          "${PACKAGE_REGISTRY_URL}/$(basename $f)"
      done
    # Upload artifacts-metadata.json to Package Registry
    - |
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file artifacts-metadata.json \
        "${PACKAGE_REGISTRY_URL}/artifacts-metadata.json"
  artifacts:
    expire_in: 1 day
    paths:
      - release/
      - artifacts-metadata.json

release:
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: build
      artifacts: false
  script:
    - echo "Creating release ${CI_COMMIT_TAG}"
  release:
    tag_name: $CI_COMMIT_TAG
    name: ${CI_COMMIT_TAG#v}
    description: Release ${CI_COMMIT_TAG#v}
    assets:
      links:
        - name: fritz-mcp-linux-amd64
          url: "${PACKAGE_REGISTRY_URL}/fritz-mcp-linux-amd64"
          filepath: /fritz-mcp-linux-amd64
        - name: fritz-mcp-linux-amd64.sig
          url: "${PACKAGE_REGISTRY_URL}/fritz-mcp-linux-amd64.sig"
          filepath: /fritz-mcp-linux-amd64.sig
        - name: fritz-mcp-linux-amd64.pem
          url: "${PACKAGE_REGISTRY_URL}/fritz-mcp-linux-amd64.pem"
          filepath: /fritz-mcp-linux-amd64.pem
        - name: fritz-mcp-linux-arm64
          url: "${PACKAGE_REGISTRY_URL}/fritz-mcp-linux-arm64"
          filepath: /fritz-mcp-linux-arm64
        - name: fritz-mcp-linux-arm64.sig
          url: "${PACKAGE_REGISTRY_URL}/fritz-mcp-linux-arm64.sig"
          filepath: /fritz-mcp-linux-arm64.sig
        - name: fritz-mcp-linux-arm64.pem
          url: "${PACKAGE_REGISTRY_URL}/fritz-mcp-linux-arm64.pem"
          filepath: /fritz-mcp-linux-arm64.pem
        - name: fritz-mcp-linux-arm
          url: "${PACKAGE_REGISTRY_URL}/fritz-mcp-linux-arm"
          filepath: /fritz-mcp-linux-arm
        - name: fritz-mcp-linux-arm.sig
          url: "${PACKAGE_REGISTRY_URL}/fritz-mcp-linux-arm.sig"
          filepath: /fritz-mcp-linux-arm.sig
        - name: fritz-mcp-linux-arm.pem
          url: "${PACKAGE_REGISTRY_URL}/fritz-mcp-linux-arm.pem"
          filepath: /fritz-mcp-linux-arm.pem
        - name: fritz-mcp-linux-386
          url: "${PACKAGE_REGISTRY_URL}/fritz-mcp-linux-386"
          filepath: /fritz-mcp-linux-386
        - name: fritz-mcp-linux-386.sig
          url: "${PACKAGE_REGISTRY_URL}/fritz-mcp-linux-386.sig"
          filepath: /fritz-mcp-linux-386.sig
        - name: fritz-mcp-linux-386.pem
          url: "${PACKAGE_REGISTRY_URL}/fritz-mcp-linux-386.pem"
          filepath: /fritz-mcp-linux-386.pem
        - name: fritz-mcp-darwin-amd64
          url: "${PACKAGE_REGISTRY_URL}/fritz-mcp-darwin-amd64"
          filepath: /fritz-mcp-darwin-amd64
        - name: fritz-mcp-darwin-amd64.sig
          url: "${PACKAGE_REGISTRY_URL}/fritz-mcp-darwin-amd64.sig"
          filepath: /fritz-mcp-darwin-amd64.sig
        - name: fritz-mcp-darwin-amd64.pem
          url: "${PACKAGE_REGISTRY_URL}/fritz-mcp-darwin-amd64.pem"
          filepath: /fritz-mcp-darwin-amd64.pem
        - name: fritz-mcp-darwin-arm64
          url: "${PACKAGE_REGISTRY_URL}/fritz-mcp-darwin-arm64"
          filepath: /fritz-mcp-darwin-arm64
        - name: fritz-mcp-darwin-arm64.sig
          url: "${PACKAGE_REGISTRY_URL}/fritz-mcp-darwin-arm64.sig"
          filepath: /fritz-mcp-darwin-arm64.sig
        - name: fritz-mcp-darwin-arm64.pem
          url: "${PACKAGE_REGISTRY_URL}/fritz-mcp-darwin-arm64.pem"
          filepath: /fritz-mcp-darwin-arm64.pem
        - name: fritz-mcp-windows-amd64.exe
          url: "${PACKAGE_REGISTRY_URL}/fritz-mcp-windows-amd64.exe"
          filepath: /fritz-mcp-windows-amd64.exe
        - name: fritz-mcp-windows-amd64.exe.sig
          url: "${PACKAGE_REGISTRY_URL}/fritz-mcp-windows-amd64.exe.sig"
          filepath: /fritz-mcp-windows-amd64.exe.sig
        - name: fritz-mcp-windows-amd64.exe.pem
