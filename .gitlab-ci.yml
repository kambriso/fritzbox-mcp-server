variables:
  RUNNER_GENERATE_ARTIFACTS_METADATA: "true"
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/fritz-mcp/${CI_COMMIT_TAG}"

test:
  image: golang:1.25
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always
  script:
    - make tidy
    - make test

build:
  image: golang:1.25
  rules:
    - if: $CI_COMMIT_TAG
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - VERSION=${CI_COMMIT_TAG#v}
    - echo "VERSION=$VERSION" >> build.env
    - make dists
    # Generate checksums
    - (cd build && find . -type f -name 'fritz-mcp*' -exec sha256sum {} \; | sed 's|  ./|  |' > ../SHA256SUMS)
    # Install cosign for signing
    - apt-get update && apt-get install -y curl
    - curl -sSL https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64 -o /usr/local/bin/cosign
    - chmod +x /usr/local/bin/cosign
    # Sign each binary with keyless signing (OIDC)
    - |
      for f in $(find build -type f -name 'fritz-mcp*'); do
        cosign sign-blob --yes \
          --oidc-issuer=https://gitlab.com \
          --output-signature="${f}.sig" \
          --output-certificate="${f}.pem" \
          "$f"
      done
    # Upload binaries to Package Registry
    - |
      upload() {
        curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$1" "${PACKAGE_REGISTRY_URL}/$2"
      }
      upload build/linux/amd64/fritz-mcp fritz-mcp-linux-amd64
      upload build/linux/arm64/fritz-mcp fritz-mcp-linux-arm64
      upload build/linux/arm/fritz-mcp fritz-mcp-linux-arm
      upload build/linux/386/fritz-mcp fritz-mcp-linux-386
      upload build/darwin/amd64/fritz-mcp fritz-mcp-darwin-amd64
      upload build/darwin/arm64/fritz-mcp fritz-mcp-darwin-arm64
      upload build/windows/amd64/fritz-mcp.exe fritz-mcp-windows-amd64.exe
      upload build/windows/arm64/fritz-mcp.exe fritz-mcp-windows-arm64.exe
      upload build/wasi/wasm/fritz-mcp.wasm fritz-mcp-wasi.wasm
      upload SHA256SUMS SHA256SUMS
  artifacts:
    reports:
      dotenv: build.env

release:
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: build
      artifacts: true
  script:
    - echo "Creating release $VERSION"
  release:
    tag_name: $CI_COMMIT_TAG
    name: $VERSION
    description: Release $VERSION
    assets:
      links:
        - name: fritz-mcp-linux-amd64
          url: ${PACKAGE_REGISTRY_URL}/fritz-mcp-linux-amd64
        - name: fritz-mcp-linux-arm64
          url: ${PACKAGE_REGISTRY_URL}/fritz-mcp-linux-arm64
        - name: fritz-mcp-linux-arm
          url: ${PACKAGE_REGISTRY_URL}/fritz-mcp-linux-arm
        - name: fritz-mcp-linux-386
          url: ${PACKAGE_REGISTRY_URL}/fritz-mcp-linux-386
        - name: fritz-mcp-darwin-amd64
          url: ${PACKAGE_REGISTRY_URL}/fritz-mcp-darwin-amd64
        - name: fritz-mcp-darwin-arm64
          url: ${PACKAGE_REGISTRY_URL}/fritz-mcp-darwin-arm64
        - name: fritz-mcp-windows-amd64.exe
          url: ${PACKAGE_REGISTRY_URL}/fritz-mcp-windows-amd64.exe
        - name: fritz-mcp-windows-arm64.exe
          url: ${PACKAGE_REGISTRY_URL}/fritz-mcp-windows-arm64.exe
        - name: fritz-mcp-wasi.wasm
          url: ${PACKAGE_REGISTRY_URL}/fritz-mcp-wasi.wasm
        - name: SHA256SUMS
          url: ${PACKAGE_REGISTRY_URL}/SHA256SUMS
