name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  actions: read
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: Build release binaries
        run: make dists

      - name: Prepare release files
        run: |
          mkdir -p release
          cp build/linux/amd64/fritz-mcp release/fritz-mcp-linux-amd64
          cp build/linux/arm64/fritz-mcp release/fritz-mcp-linux-arm64
          cp build/linux/386/fritz-mcp release/fritz-mcp-linux-386
          cp build/linux/arm/fritz-mcp release/fritz-mcp-linux-arm
          cp build/darwin/amd64/fritz-mcp release/fritz-mcp-darwin-amd64
          cp build/darwin/arm64/fritz-mcp release/fritz-mcp-darwin-arm64
          cp build/windows/amd64/fritz-mcp.exe release/fritz-mcp-windows-amd64.exe
          cp build/windows/arm64/fritz-mcp.exe release/fritz-mcp-windows-arm64.exe
          cp build/wasi/wasm/fritz-mcp.wasm release/fritz-mcp.wasm
          cd release && sha256sum fritz-mcp-* > SHA256SUMS

      - name: Generate hashes for SLSA provenance
        id: hash
        run: |
          cd release
          echo "hashes=$(sha256sum fritz-mcp-* | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release/
          retention-days: 5

  provenance:
    needs: build
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: true

  release:
    needs: [build, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release/

      - name: Set release version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: release/*
