name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-and-release:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: Build release artifacts
        run: |
          make -j$(nproc) checksums
          make mcpb

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          repository: kambriso/fritzbox-mcp-server
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          generate_release_notes: true
          files: |
            dist/fritz-mcp-linux-amd64.tar.xz
            dist/fritz-mcp-linux-arm64.tar.xz
            dist/fritz-mcp-linux-386.tar.xz
            dist/fritz-mcp-linux-arm.tar.xz
            dist/fritz-mcp-darwin-amd64.tar.xz
            dist/fritz-mcp-darwin-arm64.tar.xz
            dist/fritz-mcp-windows-amd64.zip
            dist/fritz-mcp-windows-arm64.zip
            dist/fritz-mcp-wasi.tar.xz
            dist/fritzbox-mcp-server.mcpb
            dist/sbom.json
            dist/SHA256SUMS
