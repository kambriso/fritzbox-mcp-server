name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: Build release binaries
        run: make dists

      - name: Generate checksums
        run: |
          cd build
          find . -type f \( -name 'fritz-mcp*' -o -name '*.wasm' \) | sort | xargs sha256sum > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/linux/amd64/fritz-mcp
            build/linux/arm64/fritz-mcp
            build/linux/386/fritz-mcp
            build/linux/arm/fritz-mcp
            build/darwin/amd64/fritz-mcp
            build/darwin/arm64/fritz-mcp
            build/windows/amd64/fritz-mcp.exe
            build/windows/arm64/fritz-mcp.exe
            build/wasi/wasm/fritz-mcp.wasm
            build/SHA256SUMS
